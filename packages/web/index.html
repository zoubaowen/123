<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#10251f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI小宝学院 - 青少年 AI 编程创作伙伴</title>
    <script>
      try {
        document.documentElement.style.backgroundColor = '#10251f'
        document.documentElement.style.colorScheme = 'dark'
      } catch {}
    </script>
    <style>
      #splash-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 30%, rgba(94, 234, 212, 0.24), transparent 24%),
          radial-gradient(circle at 82% 22%, rgba(253, 230, 138, 0.2), transparent 24%),
          radial-gradient(circle at 16% 72%, rgba(251, 146, 60, 0.18), transparent 28%),
          linear-gradient(140deg, #10251f 0%, #153126 42%, #26324a 100%);
        color: #fff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash-root::before {
        content: '';
        position: absolute;
        width: 440px;
        height: 440px;
        border: 1px solid rgba(207, 250, 254, 0.12);
        border-radius: 999px;
      }
      #splash-root::after {
        content: '';
        position: absolute;
        width: 310px;
        height: 310px;
        border: 1px dashed rgba(253, 230, 138, 0.25);
        border-radius: 999px;
        animation: splash-spin 18s linear infinite;
      }
      #splash-root .classroom-board {
        position: absolute;
        left: 8%;
        top: 18%;
        width: 288px;
        height: 192px;
        border: 1px solid rgba(167, 243, 208, 0.1);
        border-radius: 32px;
        background: rgba(6, 78, 59, 0.2);
        filter: blur(1px);
      }
      #splash-root .window-glow {
        position: absolute;
        right: 8%;
        top: 16%;
        width: 96px;
        height: 144px;
        border-radius: 28px;
        background: rgba(254, 243, 199, 0.2);
        filter: blur(18px);
      }
      #splash-root .floor-glow {
        position: absolute;
        bottom: 10%;
        width: 520px;
        height: 96px;
        border-radius: 999px;
        background: rgba(254, 243, 199, 0.2);
        filter: blur(42px);
      }
      #splash-root .splash-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px;
        text-align: center;
      }
      #splash-root .splash-xiaobao-wrap {
        position: relative;
      }
      #splash-root .splash-xiaobao-wrap::before {
        content: '★';
        position: absolute;
        left: -34px;
        top: 36px;
        color: rgba(254, 243, 199, 0.86);
        font-size: 22px;
      }
      #splash-root .splash-xiaobao-wrap::after {
        content: '{ }';
        position: absolute;
        left: 22px;
        bottom: 6px;
        color: rgba(209, 250, 229, 0.78);
        font-size: 14px;
        font-weight: 800;
      }
      #splash-root .splash-xiaobao {
        width: 188px;
        height: 188px;
        filter: drop-shadow(0 24px 34px rgba(0, 0, 0, 0.28));
        animation: splash-float 3.2s ease-in-out infinite;
      }
      #splash-root .splash-title {
        margin-top: 26px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0;
      }
      #splash-root .splash-subtitle {
        margin-top: 8px;
        font-size: 14px;
        color: rgba(236, 254, 255, 0.78);
      }
      #splash-root .splash-loader {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #splash-root .splash-bar {
        width: 36px;
        height: 8px;
        border-radius: 999px;
        background: #67e8f9;
        box-shadow: 0 0 18px rgba(103, 232, 249, 0.8);
        animation: splash-pulse 1.35s ease-in-out infinite;
      }
      #splash-root .splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        animation: splash-dot 1.35s ease-in-out infinite;
      }
      #splash-root .splash-dot:nth-child(2) {
        background: #fef3c7;
        animation-delay: 120ms;
      }
      #splash-root .splash-dot:nth-child(3) {
        background: #fdba74;
        animation-delay: 240ms;
      }
      #splash-root .splash-tip {
        min-height: 18px;
        margin-top: 18px;
        font-size: 12px;
        color: rgba(236, 254, 255, 0.58);
      }
      #splash-root.splash-done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease-out;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-9px);
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.52;
          transform: scaleX(0.8);
        }
        50% {
          opacity: 1;
          transform: scaleX(1.12);
        }
      }
      @keyframes splash-dot {
        0%,
        100% {
          opacity: 0.42;
          transform: translateY(0);
        }
        45% {
          opacity: 1;
          transform: translateY(-7px);
        }
      }
    </style>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </head>

    <div id="root"></div>
    <script>
      var tips = [
        '小宝正在启动星光创作空间...',
        '正在连接 AI 学习伙伴...',
        '正在准备代码、动画、音乐和游戏工具...',
        '准备好一起把好点子变成作品啦...',
      ]
      var i = 0
      setInterval(function () {
        i = (i + 1) % tips.length
        var el = document.getElementById('splash-tip')
        if (el) el.textContent = tips[i]
      }, 2600)
    </script>
